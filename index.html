<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Living - Vocabulario</title>
<style>
  :root {
    --cream: #FFF6E0;
    --coral: #EA4630;
    --orange: #F8B229;
    --navy: #0B3D2E;
    --deepblue: #0B3D2E;
    --teal: #146B3A;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--navy);
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 2.5rem 2rem;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 6px;
    color: var(--deepblue);
    text-align: center;
    letter-spacing: 0.3px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--orange);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 2rem;
  }
  .card {
    max-width: 1100px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,43,91,0.10);
    padding: 10px 28px;
    border-top: 5px solid var(--coral);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0 40px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #F2DDB3;
  }
  .en-wrap {
    flex: 1;
    min-width: 0;
  }
  .en {
    font-size: 20px;
    font-weight: 600;
    display: block;
    color: var(--deepblue);
  }
  .phon {
    font-size: 18px;
    color: var(--orange);
    font-style: italic;
    display: block;
  }
  .es {
    font-size: 20px;
    color: #146B3A;
    flex: 1;
    min-width: 0;
  }
  button.play {
    width: 28px;
    height: 28px;
    padding: 0;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--coral);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button.play:hover {
    background: var(--orange);
    transform: scale(1.06);
  }

  /* ---- Reproductor secuencial ---- */
  .player {
    max-width: 1100px;
    margin: 0 auto 1.75rem;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,43,91,0.10);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-top: 5px solid var(--navy);
  }
  .player-btn {
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    background: var(--navy);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .player-btn:hover {
    background: var(--deepblue);
    transform: scale(1.06);
  }
  .player-btn.main {
    width: 48px;
    height: 48px;
    background: var(--coral);
    font-size: 17px;
  }
  .player-btn.main:hover {
    background: var(--orange);
  }
  .player-info {
    flex: 1;
    min-width: 0;
  }
  .player-word {
    font-size: 15px;
    font-weight: 700;
    color: var(--deepblue);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-progress-track {
    height: 4px;
    background: #F2DDB3;
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .player-progress-fill {
    height: 100%;
    background: var(--coral);
    width: 0%;
    transition: width 0.2s ease;
  }
  .player-count {
    font-size: 12px;
    color: #4C8A5E;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ---- Modo celular ---- */
  @media (max-width: 700px) {
    .player { padding: 12px 14px; gap: 10px; border-radius: 14px; }
    .player-btn { width: 42px; height: 42px; font-size: 16px; }
    .player-btn.main { width: 52px; height: 52px; font-size: 19px; }
    .player-word { font-size: 15px; }
    .player-count { font-size: 11px; }
    body { padding: 1.5rem 1rem; }
    h1 { font-size: 20px; }
    .subtitle { font-size: 12px; margin-bottom: 1.25rem; }
    .card { padding: 6px 16px; border-radius: 14px; }
    .grid { grid-template-columns: 1fr; gap: 0; }
    .row { padding: 16px 0; gap: 14px; }
    .en { font-size: 20px; }
    .phon { font-size: 18px; margin-top: 3px; }
    .es { font-size: 20px; margin-top: 3px; }
    button.play { width: 42px; height: 42px; font-size: 19px; }
  }
</style>
</head>
<body>

<h1>Urban Living</h1>
<div class="subtitle">Vocabulario · Inglés / Español</div>

<div class="player">
  <button class="player-btn" id="prevBtn" aria-label="Anterior">&#9664;&#9664;</button>
  <button class="player-btn main" id="playBtn" aria-label="Reproducir todo">&#9654;</button>
  <button class="player-btn" id="nextBtn" aria-label="Siguiente">&#9654;&#9654;</button>
  <div class="player-info">
    <div class="player-word" id="playerWord">Reproducir todo el vocabulario (inglés → español)</div>
    <div class="player-progress-track">
      <div class="player-progress-fill" id="playerProgress"></div>
    </div>
  </div>
  <div class="player-count" id="playerCount">0 / 45</div>
</div>

<div class="card">
  <div class="grid" id="grid"></div>
</div>

<script>
const data = [
["to adjust","ajustar","ayást"],
["to assemble","armar / ensamblar","asémbol"],
["to deliver","entregar","dilíver"],
["to decorate","decorar","dékoreit"],
["to entertain","entretener","entertéin"],
["to greet","saludar","grit"],
["to lounge","recostarse / relajarse","láunch"],
["to maintain","mantener","meintéin"],
["to order","pedir / ordenar","órder"],
["to organize","organizar","órganais"],
["to reach","alcanzar / comunicarse con","rich"],
["to relax","relajarse","riláks"],
["to socialize","socializar","sóushalais"],
["to stay","quedarse","stéi"],
["to unwind","relajarse / desestresarse","anuáind"],
["amenities","amenidades","améniti s"],
["apartment","apartamento","apártment"],
["cabinet","gabinete","kábinet"],
["common area","área común","kómon éria"],
["concierge","conserje","konsiérsh"],
["delivery person","repartidor","dilíveri pérson"],
["furniture","muebles","férnicher"],
["guest","invitado","guest"],
["indoor","interior","índor"],
["lobby","vestíbulo","lóbi"],
["outdoor","exterior","áutdor"],
["pet","mascota","pet"],
["resident","residente","rézident"],
["shelving unit","mueble de estantería","shélving iúnit"],
["urbanite","habitante urbano","érbanait"],
["chic","elegante","shik"],
["cozy","acogedor","kóusi"],
["high-end","de alta gama","jái end"],
["indoor-outdoor","interior-exterior","índor áutdor"],
["minimalist","minimalista","mínimalist"],
["modern","moderno","módern"],
["multifunctional","multifuncional","maltifánkshonal"],
["pet-friendly","apto para mascotas","pet fréndli"],
["shared","compartido","shérd"],
["spacious","espacioso","spéishos"],
["comfortably","cómodamente","kámftabli"],
["efficiently","eficientemente","ifíshiently"],
["locally","localmente","lóukali"],
["quietly","silenciosamente","kuáietli"],
["stylishly","con estilo","stáilishli"]
];

const cols = 3, rows = 15;
const grid = document.getElementById('grid');

for (let c = 0; c < cols; c++) {
  const col = document.createElement('div');
  for (let r = 0; r < rows; r++) {
    const [en, es, phon] = data[c * rows + r];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <button class="play" aria-label="Escuchar ${en}" data-word="${en}">&#128266;</button>
      <span class="en-wrap">
        <span class="en">${en}</span>
        <span class="phon">${phon}</span>
      </span>
      <span class="es">${es}</span>
    `;
    col.appendChild(row);
  }
  grid.appendChild(col);
}

grid.addEventListener('click', e => {
  const btn = e.target.closest('button[data-word]');
  if (!btn) return;
  const utter = new SpeechSynthesisUtterance(btn.dataset.word);
  utter.lang = 'en-US';
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
});

// ---- Reproductor secuencial (inglés -> español, todo el vocabulario) ----
const total = data.length;
let playerIndex = 0;
let playerPhase = 'en'; // 'en' o 'es'
let isPlaying = false;

const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playerWord = document.getElementById('playerWord');
const playerProgress = document.getElementById('playerProgress');
const playerCount = document.getElementById('playerCount');

function updatePlayerUI() {
  const [en, es] = data[playerIndex];
  playerWord.textContent = playerPhase === 'en' ? en : (en + '  →  ' + es);
  playerCount.textContent = (playerIndex + 1) + ' / ' + total;
  playerProgress.style.width = (((playerIndex) / total) * 100) + '%';
}

function speakPlayer(text, lang, onEnd) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.onend = () => { if (isPlaying) onEnd(); };
  speechSynthesis.speak(u);
}

function playStep() {
  if (playerIndex >= total) {
    stopPlayer();
    playerIndex = 0;
    playerPhase = 'en';
    updatePlayerUI();
    return;
  }
  updatePlayerUI();
  const [en, es] = data[playerIndex];
  if (playerPhase === 'en') {
    speakPlayer(en, 'en-US', () => {
      playerPhase = 'es';
      playStep();
    });
  } else {
    speakPlayer(es, 'es-ES', () => {
      playerPhase = 'en';
      playerIndex++;
      playStep();
    });
  }
}

function startPlayer() {
  isPlaying = true;
  playBtn.innerHTML = '&#10074;&#10074;';
  playBtn.setAttribute('aria-label', 'Pausar');
  playStep();
}

function stopPlayer() {
  isPlaying = false;
  speechSynthesis.cancel();
  playBtn.innerHTML = '&#9654;';
  playBtn.setAttribute('aria-label', 'Reproducir todo');
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    stopPlayer();
  } else {
    startPlayer();
  }
});

prevBtn.addEventListener('click', () => {
  speechSynthesis.cancel();
  playerPhase = 'en';
  playerIndex = Math.max(0, playerIndex - 1);
  updatePlayerUI();
  if (isPlaying) playStep();
});

nextBtn.addEventListener('click', () => {
  speechSynthesis.cancel();
  playerPhase = 'en';
  playerIndex = Math.min(total - 1, playerIndex + 1);
  updatePlayerUI();
  if (isPlaying) playStep();
});

updatePlayerUI();
</script>

</body>
</html>
